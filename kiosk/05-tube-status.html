<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=800, height=480, initial-scale=1">
  <title>Tube Status Board</title>
  <style>

    /* ═══════════════════════════════════════════════════════════════════
       FONTS + BASE — standalone module, own CSS/JS, no shared dependencies.
       Geist for text, Geist Mono for the clock and times.
       All sizes are fixed pixels for the 800 × 480 screen, on a 4px grid.
    ═══════════════════════════════════════════════════════════════════ */
    @import url('https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap');

    :root {
      /* Graphite ramp: the wall. Colour belongs to the lines, not the chrome. */
      --bg:        #0f0f10;
      --card:      #19191b;
      --raised:    #232325;
      --hairline:  rgba(237, 237, 237, 0.08);
      --text:      #ededed;
      --text-2:    #a1a1a6;
      --muted:     #85858b;

      /* Status colours carry meaning only. */
      --good:      #4cc38a;
      --warn:      #f0b429;
      --bad:       #e5484d;
      --info:      #85858b;

      --tfl-red:   #DC241F;   /* the accent: top rule and the train's stripe */
      --ease:      cubic-bezier(0.22, 1, 0.36, 1);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 800px; height: 480px;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: 'Geist', system-ui, sans-serif;
      font-variant-numeric: tabular-nums;
      -webkit-font-smoothing: antialiased;
      display: flex;
      flex-direction: column;
      border-top: 4px solid var(--tfl-red);
    }
    .mono { font-family: 'Geist Mono', ui-monospace, monospace; }

    /* ── Header ── */
    #header {
      height: 60px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
    }
    #brand { display: flex; align-items: center; gap: 12px; }
    #roundel { height: 36px; width: auto; display: block; }
    #title {
      font-size: 22px;
      line-height: 28px;
      font-weight: 500;
    }
    #subtitle {
      font-size: 13px;
      line-height: 16px;
      color: var(--text-2);
    }
    #when { text-align: right; }
    #clock {
      font-size: 32px;
      line-height: 32px;
      font-weight: 500;
    }
    #date {
      font-size: 13px;
      line-height: 16px;
      color: var(--text-2);
      margin-top: 4px;
    }

    /* ── Banner: only shown when an update fails (or Thameslink is
       unavailable). The last good data stays on screen underneath.
       Long messages wrap rather than being cut off. ── */
    #fetch-error {
      display: none;
      flex-shrink: 0;
      margin: 0 16px 4px;
      padding: 4px 12px 4px 36px;
      position: relative;
      font-size: 13px;
      line-height: 20px;
      color: var(--text);
      background: var(--card);
      border: 1px solid rgba(229, 72, 77, 0.45);
      border-radius: 8px;
    }
    #fetch-error .banner-icon {
      position: absolute;
      left: 12px; top: 6px;
      width: 16px; height: 16px;
      fill: none;
      stroke-width: 1.75;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* ── The rail: your train crosses it, and stalls when a delay is on
       one of your routes. The rail turns amber while that's true. ── */
    #train-track {
      position: relative;
      height: 32px;
      flex-shrink: 0;
      overflow: hidden;
      margin: 0 16px;
    }
    #train-track::after {
      content: '';
      position: absolute;
      left: 0; right: 0; bottom: 4px;
      height: 2px;
      background: var(--raised);
      transition: background-color 1.2s var(--ease);
    }
    #train-track.delayed::after { background: rgba(240, 180, 41, 0.6); }
    #train-img {
      position: absolute;
      left: 0;
      bottom: 6px;
      line-height: 0;
      will-change: transform;
      transform: translateX(800px);
    }
    #train-img svg {
      height: 20px;              /* train height: change this number to resize */
      width: auto;
      display: block;
    }

    /* ── Board: two columns of four cards ── */
    #board {
      flex: 1;
      display: none;
      gap: 8px;
      padding: 8px 16px 16px;
      min-height: 0;
    }
    .col {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-width: 0;
    }
    .card {
      flex: 1;
      display: flex;
      min-height: 0;
      background: var(--card);
      border: 1px solid var(--hairline);
      border-radius: 12px;
      overflow: hidden;
      transition: border-color 0.4s var(--ease);
    }
    .card.is-warn { border-color: rgba(240, 180, 41, 0.45); }
    .card.is-bad  { border-color: rgba(229, 72, 77, 0.55); }

    /* The line colour block: the one place with strong colour. */
    .line-badge {
      width: 160px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      padding: 0 16px;
      font-size: 20px;
      line-height: 24px;
      font-weight: 500;
    }
    .line-body {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 0 16px;
    }
    .line-status-row {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }
    .status-icon {
      width: 20px; height: 20px;
      flex-shrink: 0;
      display: block;
      fill: none;
      stroke-width: 1.75;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .line-status {
      flex: 1;
      min-width: 0;
      font-size: 20px;
      line-height: 24px;
      font-weight: 500;
    }

    /* Status text and reason use the same scroller: text that fits sits
       still, text that doesn't scrolls like a departure board. */
    .scroll-wrap { overflow: hidden; white-space: nowrap; }
    .scroll-wrap > div { display: inline-block; white-space: nowrap; }
    .scroll-wrap > div.scrolling { animation: marquee linear infinite; }
    .scroll-wrap > div span { padding-right: 64px; }
    @keyframes marquee {
      from { transform: translateX(0); }
      to   { transform: translateX(-50%); }
    }

    /* Always present, so every card is the same height whether or not
       there's a disruption to show. Lines up under the status text. */
    .line-reason-wrap {
      height: 20px;
      margin-top: 4px;
      padding-left: 28px;
    }
    .line-reason {
      font-size: 14px;
      line-height: 20px;
      color: var(--text);
    }
    .line-reason.note { color: var(--muted); }

    /* ── Summary card: fourth slot in the right-hand column ── */
    .summary {
      flex-direction: column;
      justify-content: center;
      padding: 0 16px;
    }
    .summary-label {
      font-size: 13px;
      line-height: 16px;
      color: var(--text-2);
    }
    .summary-headline {
      font-size: 20px;
      line-height: 24px;
      font-weight: 500;
      margin-top: 4px;
    }
    .summary-meta {
      font-size: 12px;
      line-height: 16px;
      color: var(--muted);
      margin-top: 4px;
    }

    /* ── Loading / first-fetch failure ── */
    #loading {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-2);
      font-size: 20px;
      text-align: center;
      padding: 0 40px;
    }
    #loading.failed { color: var(--bad); }

    /* One entrance: a short fade when the board first appears or changes. */
    #board.fade-in { animation: fadeIn 0.4s var(--ease); }
    @keyframes fadeIn { from { opacity: 0.4; } to { opacity: 1; } }

    /* ── Debug overlay: add ?debug to the end of the URL to see every
       disruption and why it was shown or hidden. ── */
    #debug {
      display: none;
      position: fixed;
      inset: 0;
      overflow: auto;
      background: rgba(5,8,12,0.95);
      color: #cfc7b6;
      font: 11px/1.45 monospace;
      padding: 12px 16px;
      white-space: pre-wrap;
      z-index: 10;
    }

  </style>
</head>

        <rect x="103" y="16" width="95" height="2.5"/>
      </g>
      <g fill="#2e2e31">
        <rect x="10" y="23" width="20" height="3" rx="1"/>
        <rect x="70" y="23" width="20" height="3" rx="1"/>
        <rect x="110" y="23" width="20" height="3" rx="1"/>
        <rect x="170" y="23" width="20" height="3" rx="1"/>
      </g>
    </svg></div>
  </div>

  <div id="loading">Loading service status</div>
  <div id="board"></div>
  <div id="debug"></div>

<script>

  /* ═══════════════════════════════════════════════════════════════════════
     CONFIG
     TfL Unified API ("500 Requests per min" product). The secondary key is
     an automatic fallback if the primary fails. Thameslink isn't run by
     TfL, but TfL's API publishes its status under the national-rail mode;
     it's fetched separately so a Thameslink outage can't blank the board.
     ═══════════════════════════════════════════════════════════════════════ */
  const CONFIG = {
    APP_KEY:             'YOUR_TFL_PRIMARY_KEY',
    APP_KEY_SECONDARY:   'YOUR_TFL_SECONDARY_KEY',
    TFL_LINES:           ['northern', 'circle', 'hammersmith-city', 'district', 'piccadilly', 'elizabeth'],
    RAIL_LINES:          ['thameslink'],
    REFRESH_MS:          60 * 1000,            // status check once a minute
    SEQUENCE_REFRESH_MS: 24 * 60 * 60 * 1000,  // station order, once a day
    SCROLL_PX_PER_SEC:   55,
    // When a line has a delay that's NOT on your route, it shows Good
    // Service with a small grey note underneath. Set false to hide the note.
    SHOW_HIDDEN_DELAY_NOTE: true,
  };

  // Two columns: four on the left, three on the right.
  const COLUMNS = [
    ['northern', 'circle', 'hammersmith-city', 'district'],
    ['piccadilly', 'elizabeth', 'thameslink'],
  ];

  const LINE_STYLE = {
    'northern':         { name: 'Northern',           bg: '#3a3a3a', fg: '#fff' }, // true black vanishes on this background
    'circle':           { name: 'Circle',             bg: '#FFD300', fg: '#111' },
    'hammersmith-city': { name: 'Hammersmith & City', bg: '#F3A9BB', fg: '#111' },
    'district':         { name: 'District',           bg: '#00782A', fg: '#fff' },
    'piccadilly':       { name: 'Piccadilly',         bg: '#003688', fg: '#fff' },
    'elizabeth':        { name: 'Elizabeth line',     bg: '#6950A1', fg: '#fff' },
    'thameslink':       { name: 'Thameslink',         bg: '#E9438D', fg: '#fff' },
  };

  /* ═══════════════════════════════════════════════════════════════════════
     YOUR ROUTES
     Each leg is one train ride: the line(s) and every station you pass,
     in order. The first and last stations are where you get on, off or
     change. A line's delay is only shown if it touches one of these legs.
       St Bart's:              Northern to Kentish Town, Thameslink to City Thameslink
       Royal London:           Northern to Tottenham Ct Rd, Elizabeth to Whitechapel
                               or Northern to King's Cross, H&C to Whitechapel
       Charing Cross Hospital: Northern to Leicester Sq, Piccadilly to Hammersmith
                               or Northern to Embankment, District to Barons Court
       Hammersmith Hospital:   Northern to King's Cross, Circle or H&C to Wood Lane
     ═══════════════════════════════════════════════════════════════════════ */
  const FINCHLEY_TO_KENTISH_TOWN = [
    'Finchley Central', 'East Finchley', 'Highgate', 'Archway', 'Tufnell Park', 'Kentish Town',
  ];
  const LEGS = {
    northernToKentishTown: {
      lines: ['northern'],
      stations: FINCHLEY_TO_KENTISH_TOWN,
    },
    northernToLeicesterSq: {     // Charing Cross branch (also covers Tottenham Court Road)
      lines: ['northern'],
      stations: [...FINCHLEY_TO_KENTISH_TOWN, 'Camden Town', 'Mornington Crescent', 'Euston',
                 'Warren Street', 'Goodge Street', 'Tottenham Court Road', 'Leicester Square'],
    },
    northernToTottenhamCtRd: {   // Charing Cross branch, getting off at Tottenham Court Road
      lines: ['northern'],
      stations: [...FINCHLEY_TO_KENTISH_TOWN, 'Camden Town', 'Mornington Crescent', 'Euston',
                 'Warren Street', 'Goodge Street', 'Tottenham Court Road'],
    },
    northernToEmbankment: {      // Charing Cross branch, all the way to Embankment
      lines: ['northern'],
      stations: [...FINCHLEY_TO_KENTISH_TOWN, 'Camden Town', 'Mornington Crescent', 'Euston',
                 'Warren Street', 'Goodge Street', 'Tottenham Court Road', 'Leicester Square',
                 'Charing Cross', 'Embankment'],
    },
    northernToKingsCross: {      // Bank branch
      lines: ['northern'],
      stations: [...FINCHLEY_TO_KENTISH_TOWN, 'Camden Town', 'Euston', "King's Cross St Pancras"],
    },
    thameslinkToCity: {
      lines: ['thameslink'],
      stations: ['Kentish Town', 'St Pancras', 'Farringdon', 'City Thameslink'],
    },
    elizabethToWhitechapel: {
      lines: ['elizabeth'],
      stations: ['Tottenham Court Road', 'Farringdon', 'Liverpool Street', 'Whitechapel'],
    },
    hcToWhitechapel: {
      lines: ['hammersmith-city'],
      stations: ["King's Cross St Pancras", 'Farringdon', 'Barbican', 'Moorgate',
                 'Liverpool Street', 'Aldgate East', 'Whitechapel'],
    },
    piccadillyToHammersmith: {
      lines: ['piccadilly'],
      stations: ['Leicester Square', 'Piccadilly Circus', 'Green Park', 'Hyde Park Corner',
                 'Knightsbridge', 'South Kensington', 'Gloucester Road', "Earl's Court",
                 'Barons Court', 'Hammersmith'],
    },
    districtToBaronsCourt: {
      lines: ['district'],
      stations: ['Embankment', 'Westminster', "St James's Park", 'Victoria', 'Sloane Square',
                 'South Kensington', 'Gloucester Road', "Earl's Court", 'West Kensington',
                 'Barons Court'],
    },
    circleOrHcToWoodLane: {
      lines: ['circle', 'hammersmith-city'],
      stations: ["King's Cross St Pancras", 'Euston Square', 'Great Portland Street', 'Baker Street',
                 'Edgware Road', 'Paddington', 'Royal Oak', 'Westbourne Park', 'Ladbroke Grove',
                 'Latimer Road', 'Wood Lane'],
    },
  };

  /* LOGIC-START ═══════════════════════════════════════════════════════════
     DISRUPTION MATCHING — pure functions, no page access.

     For each disruption, decide whether it touches one of your legs:
       1. "between A and B" in the message: work out every station between
          A and B using TfL's real station order for the line (honouring
          "via Bank" / "via Charing Cross"), and count it only if you'd
          travel along part of that stretch.
       2. Otherwise, if TfL lists affected stations: count it if one is
          where you get on, off or change, or you'd travel between two.
       3. Otherwise, a station closure ("X station is closed"): count it
          only if it's where you get on, off or change. Trains still run
          through a closed station.
       4. Otherwise (no location, e.g. "severe delays", or only where the
          cause is, like "signal failure at X"): assume it affects you.
     Anything ambiguous falls through to "affects you", so the worst case
     is an unnecessary warning, never a missed one.
     ═══════════════════════════════════════════════════════════════════════ */
  function classifyStatus(description) {
    const d = String(description || '').toLowerCase();
    if (d === 'good service') return 'good';
    if (['severe delays', 'suspended', 'closed', 'closure', 'not running']
        .some(k => d.includes(k))) return 'bad';
    if (['minor delays', 'reduced service', 'bus service', 'change of frequency',
         'diverted', 'issues reported'].some(k => d.includes(k))) return 'warn';
    return 'info'; // Special Service, Information, No Step Free Access, etc.
  }

  // Turns any station name or message into a comparable form:
  // "King's Cross St. Pancras Underground Station" -> "kings cross st pancras".
  function norm(s) {
    return String(s || '').toLowerCase()
      .replace(/\([^)]*\)/g, ' ')
      .replace(/-underground/g, ' ')
      .replace(/&/g, ' and ')
      .replace(/\b(underground|rail|dlr) station\b/g, ' ')
      .replace(/\bstation\b/g, ' ')
      .replace(/['’.]/g, '')
      .replace(/[^a-z0-9]+/g, ' ')
      .replace(/\s+/g, ' ')
      .trim();
  }

  // Exact match, or one name is a whole-word part of the other
  // ("st pancras" vs "london st pancras international").
  function sameStation(a, b) {
    if (!a || !b) return false;
    if (a === b) return true;
    return (' ' + a + ' ').includes(' ' + b + ' ') || (' ' + b + ' ').includes(' ' + a + ' ');
  }

  // Finds every station name in the (normalised) text, longest names
  // first so "edgware road" isn't also counted as "edgware".
  function findMentions(text, names) {
    let masked = ' ' + text + ' ';
    const found = [];
    [...new Set(names)].filter(Boolean).sort((a, b) => b.length - a.length).forEach(name => {
      const needle = ' ' + name + ' ';
      let i = masked.indexOf(needle);
      while (i !== -1) {
        found.push({ name, index: i }); // index = where the name starts in text
        masked = masked.slice(0, i + 1) + ' '.repeat(name.length) + masked.slice(i + 1 + name.length);
        i = masked.indexOf(needle, i + 1);
      }
    });
    return found.sort((a, b) => a.index - b.index);
  }

  // Every adjacent pair of stations covered by each "between A and B".
  function rangesFromText(text, mentions, sequences) {
    const re = /\bbetween\b/g;
    const edges = [];
    let found = false, unresolved = false, m;
    while ((m = re.exec(text))) {
      found = true;
      const after = mentions.filter(x => x.index > m.index && x.index - m.index < 200);
      if (after.length < 2 || !sequences || !sequences.length) { unresolved = true; continue; }
      const [a, b] = after;
      const tail = text.slice(b.index + b.name.length, b.index + b.name.length + 8);
      const via = /^\s+via\s/.test(tail)
        ? after.find(x => x.index > b.index && x.index - b.index < 40) : null;
      let matched = false;
      for (const seq of sequences) {
        const ia = seq.findIndex(s => sameStation(s, a.name));
        const ib = seq.findIndex(s => sameStation(s, b.name));
        if (ia < 0 || ib < 0 || ia === ib) continue;
        const span = seq.slice(Math.min(ia, ib), Math.max(ia, ib) + 1);
        if (via && !span.some(s => sameStation(s, via.name))) continue;
        matched = true;
        for (let i = 0; i < span.length - 1; i++) edges.push([span[i], span[i + 1]]);
      }
      if (!matched) unresolved = true;
    }
    return found ? { edges, unresolved } : null;
  }

  function legEndpoints(legStations) {
    return [legStations[0], legStations[legStations.length - 1]];
  }
  function legUsesEdge(legStations, [x, y]) {
    for (let i = 0; i < legStations.length - 1; i++) {
      const a = legStations[i], b = legStations[i + 1];
      if ((sameStation(a, x) && sameStation(b, y)) || (sameStation(a, y) && sameStation(b, x))) return true;
    }
    return false;
  }

  // legStations: normalised station names for the leg, in travel order.
  // lineInfo: { sequences, stationNames } from TfL, or null if unavailable.
  function assessStatus(status, legStations, lineInfo) {
    const text = norm(status.reason);
    if (!text) return { affects: true, why: 'no reason given, assuming whole line' };

    const names = lineInfo ? lineInfo.stationNames : legStations;
    const mentions = findMentions(text, names);

    const ranges = rangesFromText(text, mentions, lineInfo && lineInfo.sequences);
    if (ranges) {
      if (ranges.edges.some(e => legUsesEdge(legStations, e)))
        return { affects: true, why: '"between" range overlaps your route' };
      if (ranges.unresolved)
        return { affects: true, why: 'could not work out the "between" range, assuming affected' };
      return { affects: false, why: '"between" range is off your route' };
    }

    const stops = ((status.disruption && status.disruption.affectedStops) || [])
      .map(s => norm(s.commonName || s.name)).filter(Boolean);
    if (stops.length) {
      const hit = s => stops.some(x => sameStation(x, s));
      const endpointHit = legEndpoints(legStations).some(hit);
      let travelHit = false;
      for (let i = 0; i < legStations.length - 1; i++) {
        if (hit(legStations[i]) && hit(legStations[i + 1])) travelHit = true;
      }
      return endpointHit || travelHit
        ? { affects: true, why: 'TfL lists affected stations on your route' }
        : { affects: false, why: 'TfL lists affected stations, none on your route' };
    }

    if (/\b(closed|not stopping|not stop|will not call|no service to)\b/.test(text) && mentions.length) {
      const hit = mentions.some(x => legEndpoints(legStations).some(e => sameStation(e, x.name)));
      return hit
        ? { affects: true, why: 'a station you use is closed' }
        : { affects: false, why: 'closed station is not one you get on, off or change at' };
    }

    return { affects: true, why: 'no specific location given, assuming whole line' };
  }

  // Strips TfL's "Northern Line: " prefix and keeps the first sentence
  // (the cause); the follow-on sentences are advice boilerplate.
  function conciseReason(text) {
    let t = String(text || '').replace(/^[^:]{2,60}:\s*/, '').replace(/\bSt\./g, 'St');
    const first = t.match(/^.+?[.!?](?=\s+[A-Z]|\s*$)/);
    return (first ? first[0] : t).trim();
  }

  // Splits each line's delays into ones on your routes (shown) and ones
  // elsewhere on the line (hidden).
  // lines: TfL line objects; lineData: lineId -> { sequences, stationNames }
  function assessLines(lines, lineData) {
    const log = [];
    const byLine = {};
    for (const line of lines) {
      const legKeys = Object.keys(LEGS).filter(k => LEGS[k].lines.includes(line.id));
      const relevant = [], hidden = [];
      for (const st of (line.lineStatuses || [])) {
        if (!['warn', 'bad'].includes(classifyStatus(st.statusSeverityDescription))) continue;
        if (!legKeys.length) { relevant.push(st); continue; } // not on any route: show it, to be safe
        const verdicts = legKeys.map(k => ({ legKey: k, ...assessStatus(st, LEGS[k].stations.map(norm), lineData[line.id]) }));
        verdicts.forEach(v => log.push({ lineId: line.id, status: st.statusSeverityDescription, ...v }));
        (verdicts.some(v => v.affects) ? relevant : hidden).push(st);
      }
      byLine[line.id] = { name: line.name, relevant, hidden };
    }
    return { byLine, log };
  }
  /* LOGIC-END */

  /* ═══════════════════════════════════════════════════════════════════════
     TFL FETCHING
     ═══════════════════════════════════════════════════════════════════════ */
  async function fetchTfl(baseUrl) {
    const keys = [CONFIG.APP_KEY, CONFIG.APP_KEY_SECONDARY];
    let last = { ok: false, status: null, data: null, networkError: null };
    for (const key of keys) {
      try {
        const sep = baseUrl.includes('?') ? '&' : '?';
        const res = await fetch(`${baseUrl}${sep}app_key=${key}`);
        let data = null;
        try { data = await res.json(); } catch (_) { /* body wasn't JSON */ }
        if (res.ok) return { ok: true, status: res.status, data };
        last = { ok: false, status: res.status, data, networkError: null };
      } catch (e) {
        last = { ok: false, status: null, data: null, networkError: e };
      }
    }
    return last;
  }
  function describeFailure(r) {
    if (r.networkError) return r.networkError.message;
    if (r.data && r.data.message) return `HTTP ${r.status}: ${r.data.message}`;
    return `HTTP ${r.status || 'no response'}`;
  }

  // TfL's station order for each line, so "between A and B" can be
  // expanded into the actual stations in between. Fetched once a day;
  // if it fails, the matching just becomes more cautious (assumes affected).
  const lineData = {};
  async function loadSequences() {
    const ids = [...CONFIG.TFL_LINES, ...CONFIG.RAIL_LINES];
    await Promise.all(ids.map(async id => {
      const r = await fetchTfl(`https://api.tfl.gov.uk/Line/${id}/Route/Sequence/outbound`);
      if (!r.ok || !r.data) return; // keep whatever we had before
      const names = {};
      (r.data.stations || []).forEach(s => { names[s.id] = norm(s.name); });
      (r.data.stopPointSequences || []).forEach(seq => (seq.stopPoint || []).forEach(sp => {
        names[sp.id] = norm(sp.name);
        if (sp.stationId && !names[sp.stationId]) names[sp.stationId] = norm(sp.name);
      }));
      const sequences = (r.data.orderedLineRoutes || [])
        .map(o => (o.naptanIds || []).map(n => names[n]).filter(Boolean))
        .filter(s => s.length > 1);
      if (sequences.length) lineData[id] = { sequences, stationNames: [...new Set(sequences.flat())] };
    }));
  }

  /* ═══════════════════════════════════════════════════════════════════════
     REFRESH + RENDER
     ═══════════════════════════════════════════════════════════════════════ */
  let hasLoadedOnce = false;
  let commuteHasDisruption = false; // read by the train animation
  let lastUpdated = null;
  let lastSignature = '';

  async function refresh() {
    const [tube, rail] = await Promise.all([
      fetchTfl(`https://api.tfl.gov.uk/Line/${CONFIG.TFL_LINES.join(',')}/Status?detail=true`),
      fetchTfl(`https://api.tfl.gov.uk/Line/${CONFIG.RAIL_LINES.join(',')}/Status?detail=true`),
    ]);
    const errorEl = document.getElementById('fetch-error');

    if (!tube.ok || !Array.isArray(tube.data) || tube.data.length === 0) {
      const detail = tube.ok ? 'API responded but returned no line data' : describeFailure(tube);
      if (hasLoadedOnce) {
        showBanner(`Update failed: ${detail}`);
      } else {
        const loading = document.getElementById('loading');
        loading.textContent = `Fetch failed: ${detail}`;
        loading.classList.add('failed');
      }
      return;
    }

    const railOk = rail.ok && Array.isArray(rail.data);
    const lines = [...tube.data, ...(railOk ? rail.data : [])];
    if (railOk) {
      errorEl.style.display = 'none';
    } else {
      showBanner(`Thameslink status unavailable: ${describeFailure(rail)}`);
    }

    const { byLine, log } = assessLines(lines, lineData);
    hasLoadedOnce = true;
    lastUpdated = new Date();
    commuteHasDisruption = Object.values(byLine).some(l => l.relevant.length > 0);
    document.getElementById('train-track').classList.toggle('delayed', commuteHasDisruption);
    render(byLine);
    renderDebug(lines, log);
  }

  // Icon colour carries the meaning; status text is quiet when all is well,
  // so a delay is the only thing on the board that stands out.
  const STATUS_COLORS = { good: '#4cc38a', warn: '#f0b429', bad: '#e5484d', info: '#85858b' };
  const STATUS_TEXT_COLORS = { good: '#a1a1a6', warn: '#f0b429', bad: '#e5484d', info: '#85858b' };

  // Line icons (lucide: circle-check, triangle-alert, circle-x, circle-minus).
  const STATUS_ICONS = {
    good: '<circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/>',
    warn: '<path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/>',
    bad:  '<circle cx="12" cy="12" r="10"/><path d="m15 9-6 6"/><path d="m9 9 6 6"/>',
    info: '<circle cx="12" cy="12" r="10"/><path d="M8 12h8"/>',
  };
  const SVG_NS = 'http://www.w3.org/2000/svg';

  function el(tag, className, text) {
    const e = document.createElement(tag);
    if (className) e.className = className;
    if (text != null) e.textContent = text; // textContent, so API text can't inject HTML
    return e;
  }

  // Fixed, built-in markup only; no API text goes into an icon.
  function icon(kind, className) {
    const svg = document.createElementNS(SVG_NS, 'svg');
    svg.setAttribute('viewBox', '0 0 24 24');
    svg.setAttribute('class', className);
    svg.style.stroke = STATUS_COLORS[kind];
    svg.innerHTML = STATUS_ICONS[kind];
    return svg;
  }

  function showBanner(text) {
    const errorEl = document.getElementById('fetch-error');
    errorEl.replaceChildren(icon('warn', 'banner-icon'), document.createTextNode(text));
    errorEl.style.display = 'block';
  }

  function formatTime(d) {
    return new Intl.DateTimeFormat('en-GB', {
      timeZone: 'Europe/London', hour: '2-digit', minute: '2-digit', hour12: false,
    }).format(d);
  }

  function render(byLine) {
    const board = document.getElementById('board');
    board.replaceChildren();
    const marquees = [];
    const affectedNames = [];
    let worstOverall = 'good';

    for (const ids of COLUMNS) {
      const col = el('div', 'col');
      for (const id of ids) {
        const style = LINE_STYLE[id];
        const info = byLine[id];
        let statusText, kind, reasonText = '', isNote = false;

        if (!info) {
          statusText = 'Status unavailable';
          kind = 'info';
        } else if (info.relevant.length) {
          kind = info.relevant.some(s => classifyStatus(s.statusSeverityDescription) === 'bad') ? 'bad' : 'warn';
          statusText = [...new Set(info.relevant.map(s => s.statusSeverityDescription))].join(' / ');
          reasonText = [...new Set(info.relevant.map(s => s.reason ? conciseReason(s.reason) : s.statusSeverityDescription))].join('   •   ');
          affectedNames.push(style.name);
          if (kind === 'bad' || worstOverall === 'good') worstOverall = kind;
        } else {
          statusText = 'Good Service';
          kind = 'good';
          if (info.hidden.length && CONFIG.SHOW_HIDDEN_DELAY_NOTE) {
            const descs = [...new Set(info.hidden.map(s => s.statusSeverityDescription))].join(' / ');
            reasonText = `${descs} elsewhere on the line, not on your route`;
            isNote = true;
          }
        }

        const card = el('div', 'card' + (kind === 'warn' ? ' is-warn' : kind === 'bad' ? ' is-bad' : ''));
        const badge = el('div', 'line-badge', (info && info.name) || style.name);
        badge.style.background = style.bg;
        badge.style.color = style.fg;

        const body = el('div', 'line-body');
        const statusRow = el('div', 'line-status-row');
        const statusWrap = el('div', 'line-status scroll-wrap');
        const statusInner = el('div');
        statusWrap.style.color = STATUS_TEXT_COLORS[kind];
        statusWrap.append(statusInner);
        statusRow.append(icon(kind, 'status-icon'), statusWrap);

        const reasonWrap = el('div', 'line-reason-wrap scroll-wrap');
        const reasonInner = el('div', 'line-reason' + (isNote ? ' note' : ''));
        reasonWrap.append(reasonInner);

        body.append(statusRow, reasonWrap);
        card.append(badge, body);
        col.append(card);
        marquees.push({ wrap: statusWrap, inner: statusInner, text: statusText });
        if (reasonText) marquees.push({ wrap: reasonWrap, inner: reasonInner, text: reasonText });
      }
      board.append(col);
    }

    // Fourth slot in the shorter column: an at-a-glance commute summary.
    const shortest = [...board.children].sort((a, b) => a.children.length - b.children.length)[0];
    shortest.append(renderSummary(worstOverall, affectedNames));

    document.getElementById('loading').style.display = 'none';
    board.style.display = 'flex';
    // Crossfade only when something actually changed, not on every
    // once-a-minute refresh.
    const signature = JSON.stringify(Object.entries(byLine).map(([id, l]) =>
      [id, l.relevant.map(s => s.statusSeverityDescription + s.reason), l.hidden.length]));
    if (signature !== lastSignature) {
      board.classList.remove('fade-in');
      void board.offsetWidth; // restart the crossfade
      board.classList.add('fade-in');
      lastSignature = signature;
    }
    requestAnimationFrame(() => marquees.forEach(m => applyMarquee(m.wrap, m.inner, m.text)));
  }

  function renderSummary(worst, affectedNames) {
    const card = el('div', 'card summary');
    const headline = !affectedNames.length ? 'All routes clear'
      : affectedNames.length <= 2 ? `Delays on ${affectedNames.join(' and ')}`
      : `Delays on ${affectedNames.length} of your lines`;
    const head = el('div', 'summary-headline scroll-wrap');
    const headInner = el('div');
    head.style.color = affectedNames.length ? STATUS_TEXT_COLORS[worst] : 'var(--text)';
    head.append(headInner);
    card.append(
      el('div', 'summary-label', 'Your routes'),
      head,
      el('div', 'summary-meta mono', `Updated ${formatTime(lastUpdated)}, checked every minute`),
    );
    requestAnimationFrame(() => applyMarquee(head, headInner, headline));
    return card;
  }

  // Scrolls the text only if it doesn't fit, looping seamlessly.
  function applyMarquee(wrap, inner, text) {
    inner.classList.remove('scrolling');
    inner.textContent = text;
    if (inner.scrollWidth <= wrap.clientWidth) return;
    inner.replaceChildren(el('span', null, text), el('span', null, text));
    inner.style.animationDuration = `${(inner.scrollWidth / 2) / CONFIG.SCROLL_PX_PER_SEC}s`;
    inner.classList.add('scrolling');
  }

  function renderDebug(lines, log) {
    if (!/[?&]debug\b/.test(location.search)) return;
    const out = [];
    out.push('STATION ORDER LOADED: ' + [...CONFIG.TFL_LINES, ...CONFIG.RAIL_LINES]
      .map(id => `${id}=${lineData[id] ? 'yes' : 'NO'}`).join('  '));
    out.push('');
    for (const line of lines) {
      for (const s of (line.lineStatuses || [])) {
        out.push(`${line.id}: ${s.statusSeverityDescription}${s.reason ? ' | ' + s.reason : ''}`);
      }
    }
    out.push('', 'DECISIONS (per leg):');
    if (!log.length) out.push('  none, no delays on these lines');
    for (const d of log) {
      out.push(`  ${d.affects ? 'SHOWN ' : 'hidden'}  [${d.lineId}] ${d.status} on ${d.legKey}: ${d.why}`);
    }
    const dbg = document.getElementById('debug');
    dbg.textContent = out.join('\n');
    dbg.style.display = 'block';
  }

  /* ═══════════════════════════════════════════════════════════════════════
     TRAIN MOOD — a smooth crossing when nothing affects your routes; a
     slow crossing with a stall mid-track when something does.
     ═══════════════════════════════════════════════════════════════════════ */
  const trainTrackEl = document.getElementById('train-track');
  const trainImgEl = document.getElementById('train-img');
  const TRAIN_NORMAL_SECONDS = 10;
  const TRAIN_DELAYED_LEG_SECONDS = 7;
  const TRAIN_STALL_MS = 1400;
  let trainTimer = null;

  // Moves with transform rather than left, so the Pi doesn't re-lay out
  // the page on every frame.
  function moveTrain(x) { trainImgEl.style.transform = `translateX(${x}px)`; }

  function runTrainCrossing() {
    trainImgEl.style.transition = 'none';
    moveTrain(trainTrackEl.clientWidth);
    void trainImgEl.offsetWidth; // force reflow so the transition restarts

    if (!commuteHasDisruption) {
      trainImgEl.style.transition = `transform ${TRAIN_NORMAL_SECONDS}s linear`;
      requestAnimationFrame(() => moveTrain(-trainImgEl.offsetWidth));
      scheduleNext(TRAIN_NORMAL_SECONDS * 1000 + 600);
      return;
    }

    trainImgEl.style.transition = `transform ${TRAIN_DELAYED_LEG_SECONDS}s ease-in-out`;
    requestAnimationFrame(() => moveTrain(Math.round(trainTrackEl.clientWidth * 0.4)));
    setTimeout(() => {
      trainImgEl.style.transition = `transform ${TRAIN_DELAYED_LEG_SECONDS}s ease-in`;
      requestAnimationFrame(() => moveTrain(-trainImgEl.offsetWidth));
    }, TRAIN_DELAYED_LEG_SECONDS * 1000 + TRAIN_STALL_MS);
    scheduleNext(TRAIN_DELAYED_LEG_SECONDS * 2000 + TRAIN_STALL_MS + 600);
  }
  function scheduleNext(ms) {
    clearTimeout(trainTimer);
    trainTimer = setTimeout(runTrainCrossing, ms);
  }

  /* ═══════════════════════════════════════════════════════════════════════
     CLOCK + START
     ═══════════════════════════════════════════════════════════════════════ */
  function tickClock() {
    const now = new Date();
    document.getElementById('clock').textContent = formatTime(now);
    document.getElementById('date').textContent = new Intl.DateTimeFormat('en-GB', {
      timeZone: 'Europe/London', weekday: 'short', day: 'numeric', month: 'short',
    }).format(now);
  }

  loadSequences().finally(refresh);
  setInterval(refresh, CONFIG.REFRESH_MS);
  setInterval(loadSequences, CONFIG.SEQUENCE_REFRESH_MS);
  runTrainCrossing();
  tickClock();
  setInterval(tickClock, 1000);

</script>
</body>
</html>
