<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Philips 5400 Anatomy</title><style>

}

  --anatomy-page:#f2f2ef;--anatomy-card:#fbfbfa;--anatomy-text:#57575a;--anatomy-strong:#18181a;--anatomy-muted:#8c8c90;
  --anatomy-paper:#fbfbfa;--anatomy-face:#ffffff;--anatomy-top:#ffffff;
  --anatomy-shade-0:#dcdcd9;--anatomy-shade-1:#e5e5e2;--anatomy-shade-2:#ededea;--anatomy-shade-3:#f4f4f1;

}
.iso-svg{display:block;width:100%;height:auto;overflow:visible}
.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}
.iso-fill{fill:var(--anatomy-paper);stroke:none}
.iso-solid[data-lit]>.iso-fill{fill:var(--anatomy-face)}
.iso-shade,.iso-top{stroke:none}
.iso-shade[data-shade="0"]{fill:var(--anatomy-shade-0)}
.iso-shade[data-shade="1"]{fill:var(--anatomy-shade-1)}
.iso-shade[data-shade="2"]{fill:var(--anatomy-shade-2)}
.iso-shade[data-shade="3"]{fill:var(--anatomy-shade-3)}
.iso-top{fill:var(--anatomy-top)}
.iso-solid[data-lit]>.iso-top{fill:var(--anatomy-lit-top)}
.iso-solid[data-lit]>.iso-shade{fill:var(--anatomy-lit-shade)}
.iso-solid[data-seamless]>.iso-shade,.iso-solid[data-seamless]>.iso-top{stroke-width:.4;stroke-linejoin:round}
.iso-solid[data-seamless]>.iso-shade[data-shade="0"]{stroke:var(--anatomy-shade-0)}
.iso-solid[data-seamless]>.iso-shade[data-shade="1"]{stroke:var(--anatomy-shade-1)}
.iso-solid[data-seamless]>.iso-shade[data-shade="2"]{stroke:var(--anatomy-shade-2)}
.iso-solid[data-seamless]>.iso-shade[data-shade="3"]{stroke:var(--anatomy-shade-3)}
.iso-solid[data-seamless]>.iso-top{stroke:var(--anatomy-top)}
.iso-solid[data-seamless][data-lit]>.iso-top{stroke:var(--anatomy-lit-top)}
.iso-solid[data-seamless][data-lit]>.iso-shade{stroke:var(--anatomy-lit-shade)}
.iso-solid[data-lit]>.iso-edge{stroke:var(--anatomy-lit)}
.iso-halo{fill:var(--anatomy-halo);stroke:none;filter:blur(9px);opacity:var(--anatomy-halo-opacity);transform:translateY(3px)}
.iso-line{fill:none;stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight);stroke-linecap:round;stroke-linejoin:round}
.iso-line[data-tone="hi"]{stroke:var(--anatomy-hi)}
.iso-line[data-tone="mid"]{stroke:var(--anatomy-mid)}
.iso-line[data-tone="lo"]{stroke:var(--anatomy-lo)}
.iso-line[data-tone="faint"]{stroke:var(--anatomy-faint)}
.iso-line[data-tone="lit"]{stroke:var(--anatomy-lit)}
.iso-line[data-tone="red"]{stroke:var(--anatomy-red)}
.iso-line[data-tone="green"]{stroke:var(--anatomy-green)}
.iso-line[data-tone="blue"]{stroke:var(--anatomy-blue)}
.iso-line[data-dotted]{stroke-dasharray:.01 3.5;stroke-width:1}
.iso-line[data-dashed]{stroke-dasharray:3 3}
.iso-line[data-flow]{stroke-dasharray:2 6}
.iso-wire-end{fill:var(--anatomy-paper);stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight)}
.iso-wire[data-tone="hi"] .iso-wire-end{stroke:var(--anatomy-hi)}
.iso-wire[data-tone="mid"] .iso-wire-end{stroke:var(--anatomy-mid)}
.iso-wire[data-tone="faint"] .iso-wire-end{stroke:var(--anatomy-faint)}
.iso-wire[data-tone="lit"] .iso-wire-end{stroke:var(--anatomy-lit)}
.iso-dots circle{fill:var(--anatomy-dot);stroke:none;opacity:.32}
.iso-dots[data-tone="hi"] circle{opacity:.85}
.iso-dots[data-tone="mid"] circle{opacity:.45}
.iso-dots[data-tone="lo"] circle{opacity:.22}
.iso-dots[data-tone="faint"] circle{opacity:.12}
.iso-face-text{fill:var(--anatomy-mid);font-family:var(--anatomy-mono);letter-spacing:.04em}
.iso-face-text[data-tone="hi"]{fill:var(--anatomy-hi)}
.iso-face-text[data-tone="lo"]{fill:var(--anatomy-lo)}
.iso-face-text[data-tone="faint"]{fill:var(--anatomy-faint)}
.tb-body{fill:var(--anatomy-shade-2);stroke:none}
.tb-shine{fill:var(--anatomy-top);stroke:none}
.tb-shade{fill:var(--anatomy-shade-0);stroke:none}
.tb-ring{fill:none;stroke:var(--anatomy-lo);stroke-width:.45;stroke-linecap:butt;stroke-linejoin:round}
.tb-ring[data-tone="mid"]{stroke:var(--anatomy-mid)}
.tb-ring[data-tone="faint"]{stroke:var(--anatomy-faint)}
.tb-ring[data-tone="hi"]{stroke:var(--anatomy-hi)}
@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}
.iso-plate{position:relative;padding:52px 24px;border-radius:0;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);--anatomy-paper:var(--anatomy-card)}
.iso-plate-corners{position:absolute;inset:18px 20px;pointer-events:none}
.iso-plate-corner{position:absolute;color:var(--anatomy-muted);font-family:var(--anatomy-mono);font-size:10.5px;line-height:1;letter-spacing:.04em;white-space:nowrap}
.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="readout"]{right:0;bottom:0;color:var(--anatomy-text);font-variant-numeric:tabular-nums}
.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.iso-key{display:inline-flex;align-items:center;gap:7px}
.iso-swatch{width:16px;height:10px;flex:none;overflow:visible}
.iso-swatch path{fill:none;stroke:var(--anatomy-hi);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.iso-swatch[data-mark="raised"] path,.iso-swatch[data-mark="flat"] path{stroke:var(--anatomy-mid)}
.iso-swatch[data-mark="lit"] path{stroke:var(--anatomy-lit)}
.iso-swatch[data-mark="dim"] path{stroke:var(--anatomy-lo)}
.iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}
.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}
.iso-swatch[data-mark="green"] path{stroke:var(--anatomy-green)}
.iso-swatch[data-mark="blue"] path{stroke:var(--anatomy-blue)}
.iso-swatch-crease{stroke:var(--anatomy-lo)!important}
@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}

*{box-sizing:border-box}
html{color-scheme:dark}
body[data-theme="light"]{color-scheme:light}
body{margin:0;background:var(--anatomy-page);color:var(--anatomy-text);font:14px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.iso-page{width:min(1320px,100% - 32px);margin:64px auto 96px}

/* Page-level tokens for the simulator, on top of the kit's .iso tokens. */
.iso{
  --cf-coffee:#3b2f27;--cf-coffee-top:#5a4536;--cf-crema:#9c7a5b;
  --cf-milk:#d9d6cf;--cf-foam:#efede8;--cf-water:#2b3236;
  --cf-grounds:#2c2420;--cf-grounds-top:#3a302a;--cf-bean:#4a3b31;
  --cf-flow:var(--anatomy-lit);--cf-screen:#060606;--cf-screen-ink:#e9e9e9;--cf-screen-dim:#5e5e5e;
  --cf-chip:#1a1a1a;--cf-chip-on:#e6e6e6;--cf-chip-on-ink:#111;--cf-line:#262626;
}
.iso[data-theme="light"]{
  --cf-coffee:#5b4637;--cf-coffee-top:#7a5f4b;--cf-crema:#c6a583;
  --cf-milk:#f3f1ec;--cf-foam:#ffffff;--cf-water:#dfe5e8;
  --cf-grounds:#6a5545;--cf-grounds-top:#7d6654;--cf-bean:#7a6252;
  --cf-screen:#141414;--cf-screen-ink:#f2f2f2;--cf-screen-dim:#6a6a6a;
  --cf-chip:#ffffff;--cf-chip-on:#1c1c1e;--cf-chip-on-ink:#fff;--cf-line:#e2e2df;
}
.cf-app{display:grid;gap:20px}
.cf-app .iso-plate{overflow:hidden}

/* Liquids and grounds: tints of the figure's own inks. */
.iso-solid.cf-coffee>.iso-fill,.iso-solid.cf-coffee>.iso-shade{fill:var(--cf-coffee)}
.iso-solid.cf-coffee>.iso-top{fill:var(--cf-coffee-top)}
.iso-solid.cf-milk>.iso-fill,.iso-solid.cf-milk>.iso-shade{fill:var(--cf-milk)}
.iso-solid.cf-milk>.iso-top,.iso-solid.cf-foam>.iso-top{fill:var(--cf-foam)}
.iso-solid.cf-foam>.iso-fill,.iso-solid.cf-foam>.iso-shade{fill:var(--cf-foam)}
.iso-solid.cf-water>.iso-fill,.iso-solid.cf-water>.iso-shade,.iso-solid.cf-water>.iso-top{fill:var(--cf-water)}
[data-slot="tank"] .iso-solid.cf-water>*{fill-opacity:.42}
.iso-solid.cf-grounds>.iso-fill,.iso-solid.cf-grounds>.iso-shade{fill:var(--cf-grounds)}
.iso-solid.cf-grounds>.iso-top{fill:var(--cf-grounds-top)}
.iso-solid.cf-beans>.iso-top,.iso-solid.cf-beans>.iso-fill,.iso-solid.cf-beans>.iso-shade{fill:var(--cf-bean)}
.cf-bean-dots circle{fill:var(--cf-bean);stroke:var(--anatomy-paper);stroke-width:.35}
.iso-solid.cf-cup>.iso-fill{fill:var(--anatomy-paper)}
.cf-crema{fill:none;stroke:var(--cf-crema);stroke-width:1.2}
.cf-water-line,.cf-milk-line{fill:none;stroke:var(--anatomy-hi);stroke-width:.9;stroke-linecap:round}

/* Moving water, coffee, steam and grounds along the hoses. */
.cf-flow{fill:none;stroke:var(--cf-flow);stroke-width:1.1;stroke-linecap:round;stroke-dasharray:2 5;stroke-dashoffset:calc(var(--o,0px) + var(--flow,0px));opacity:0;transition:opacity .35s var(--anatomy-ease)}
.cf-flow[data-on]{opacity:1}
.cf-flow[data-grain]{stroke-dasharray:.5 4;stroke-width:1.8}
.cf-stream{fill:none;stroke-linecap:round;stroke-dashoffset:var(--flow,0px)}
.cf-stream-coffee{stroke:var(--cf-coffee-top);stroke-width:1.2}
.cf-stream-water{stroke:var(--anatomy-mid);stroke-width:1.1;stroke-dasharray:3 2}
.cf-stream-milk{stroke:var(--cf-foam);stroke-width:2.2;filter:drop-shadow(0 0 .4px var(--anatomy-mid))}
.cf-stream-grounds{stroke:var(--cf-grounds-top);stroke-width:2;stroke-dasharray:.5 3}

/* The front display. */
.cf-bezel{fill:var(--anatomy-shade-1);stroke:var(--anatomy-lo);stroke-width:.6px;vector-effect:non-scaling-stroke}
.cf-screen{fill:var(--cf-screen);stroke:var(--anatomy-mid);stroke-width:.6px;vector-effect:non-scaling-stroke}
.cf-scr{fill:var(--cf-screen-ink);font-family:ui-sans-serif,system-ui,sans-serif}
.cf-scr-title{font-size:9.5px;font-weight:600}
.cf-scr-small{font-size:6.5px;fill:var(--cf-screen-dim)}
.cf-scr-track{fill:#ffffff1c}
.cf-scr-bar{fill:var(--cf-screen-ink)}
.cf-scr-bean{fill:none;stroke:var(--cf-screen-dim);stroke-width:.7}
.cf-scr-bean.on{fill:var(--cf-screen-ink);stroke:var(--cf-screen-ink)}
.cf-btn,.cf-key{fill:var(--anatomy-shade-2);stroke:var(--anatomy-mid);stroke-width:.6px;vector-effect:non-scaling-stroke}
.cf-btn-mark{fill:none;stroke:var(--anatomy-hi);stroke-width:.6px;vector-effect:non-scaling-stroke}
.cf-brand{font:600 7px ui-sans-serif,system-ui,sans-serif;fill:var(--anatomy-lo);letter-spacing:.6px}

/* Panel */
.cf-panel{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px;padding:22px;border-radius:14px;background:var(--anatomy-card);box-shadow:var(--anatomy-lift)}
@media (max-width:760px){.cf-panel{grid-template-columns:minmax(0,1fr);padding:16px;gap:22px}}
.cf-col{display:grid;gap:18px;align-content:start;min-width:0}
.cf-row{display:flex;flex-wrap:wrap;gap:18px 28px}
.cf-group{display:grid;gap:8px;min-width:0}
.cf-group[data-off]{opacity:.35;pointer-events:none}
.cf-label{margin:0;font:500 11px/1.2 var(--anatomy-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--anatomy-muted)}
.cf-out{margin-left:6px;text-transform:none;letter-spacing:0;color:var(--anatomy-text)}
.cf-drinks{display:flex;flex-wrap:wrap;gap:6px}
.cf-panel button{font:inherit;color:var(--anatomy-strong);background:var(--cf-chip);border:1px solid var(--cf-line);border-radius:999px;padding:6px 12px;cursor:pointer;transition:background .2s,color .2s,border-color .2s}
.cf-panel button:hover{border-color:var(--anatomy-mid)}
.cf-panel button:focus-visible,.cf-panel input:focus-visible,.cf-stage:focus-visible{outline:2px solid var(--anatomy-strong);outline-offset:2px}
.cf-panel button[aria-pressed="true"]{background:var(--cf-chip-on);color:var(--cf-chip-on-ink);border-color:var(--cf-chip-on)}
.cf-seg{display:inline-flex;border:1px solid var(--cf-line);border-radius:999px;padding:2px;gap:2px;width:max-content}
.cf-seg button{border:0;padding:5px 11px;font-size:13px}
.cf-beans{display:flex;gap:6px}
.cf-beans button{width:20px;height:28px;padding:0;border-radius:50%/50%;transform:rotate(25deg);border:1.5px solid var(--anatomy-mid);background:transparent}
.cf-beans button[aria-pressed="true"]{background:var(--anatomy-strong);border-color:var(--anatomy-strong)}
#cf-grind{width:100%;accent-color:var(--anatomy-strong)}
.cf-actions{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.cf-panel .cf-brew{font-weight:600;padding:9px 26px;background:var(--cf-chip-on);color:var(--cf-chip-on-ink);border-color:var(--cf-chip-on)}
.cf-facts,.cf-gauges{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:0}
.cf-facts div,.cf-gauges div{display:grid;gap:2px;min-width:0}
.cf-facts dt,.cf-gauges dt{font:500 10px/1.2 var(--anatomy-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--anatomy-muted)}
.cf-facts dd,.cf-gauges dd{margin:0;font:500 15px/1.3 var(--anatomy-mono);color:var(--anatomy-strong);font-variant-numeric:tabular-nums}
.cf-steps{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.cf-steps button{all:unset;box-sizing:border-box;position:relative;display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;padding:7px 10px;border-radius:8px;cursor:pointer;overflow:hidden;color:var(--anatomy-text)}
.cf-steps button::before{content:"";position:absolute;inset:auto 0 0 0;height:2px;background:var(--anatomy-strong);transform-origin:left;transform:scaleX(var(--p,0));opacity:.55}
.cf-steps button:hover{background:var(--anatomy-shade-1)}
.cf-steps button:focus-visible{outline:2px solid var(--anatomy-strong)}
.cf-steps li[data-now] button{background:var(--anatomy-shade-2);color:var(--anatomy-strong)}
.cf-step-n{font:500 11px var(--anatomy-mono);color:var(--anatomy-muted)}
.cf-step-d{font:12px var(--anatomy-mono);color:var(--anatomy-muted);font-variant-numeric:tabular-nums}
.cf-explain{min-height:120px;padding:14px 16px;border-radius:10px;background:var(--anatomy-shade-1)}
.cf-explain h4{margin:0 0 6px;font-size:15px;color:var(--anatomy-strong);text-wrap:balance}
.cf-explain p{margin:0;max-width:62ch}
@media (max-width:480px){.cf-facts,.cf-gauges{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (prefers-reduced-motion:reduce){.cf-flow{transition:none}}

/* The water tank is clear plastic: the water and the parts behind show through. */
[data-name="tank.body"] .iso-fill{fill-opacity:.12}
[data-name="tank.body"] .iso-shade{fill-opacity:.28}
[data-name="tank.body"] .iso-top{fill-opacity:.4}
[data-name="lattego.jug"] .iso-fill{fill-opacity:.2}
[data-name="lattego.jug"] .iso-shade{fill-opacity:.35}

/* Wide screens: the figure stays in view beside the controls. */
@media (min-width:1100px){
  .cf-app{grid-template-columns:minmax(0,1.45fr) minmax(340px,1fr);align-items:start;gap:24px}
  .cf-app>.iso-figure{position:sticky;top:16px}
  .cf-panel{grid-template-columns:minmax(0,1fr)}
}
/* Phones: crop the empty card margin so the machine reads at 390 px. */
@media (max-width:600px){
  .cf-stage{overflow:hidden}
  .cf-stage svg{transform:scale(1.3);transform-origin:52% 50%}

  { id: "americano", name: "Americano", coffee: 40, flow: 1.8, bar: 9, water: 110, cup: "mug" },
  { id: "cappuccino", name: "Cappuccino", coffee: 40, flow: 1.8, bar: 9, milk: 100, cup: "mug" },
  { id: "latte", name: "Latte macchiato", coffee: 60, flow: 2, bar: 8.5, milk: 200, cup: "glass" },

const CUPS = {

const TEMPS = [
  { id: 1, name: "Normal", c: 90 },
  { id: 2, name: "High", c: 93 },
  { id: 3, name: "Higher", c: 96 },
];

// Strength (1–5 beans) sets the dose.
const doseOf = (strength) => 7 + (strength - 1) * 1.1;

// One coarser step on the 12-step grinder speeds the shot up by about 4 %.
const grindFactor = (grind) => 1 + (grind - 6) * 0.04;

const STAGES = {
  heat: {
    title: "Heat",
    part: "thermo",
    text: "The thermoblock, an aluminium block with a heating element cast around a thin water channel, comes up to temperature in seconds. Water is heated only as it passes through.",
  },
  grind: {
    title: "Grind",
    part: "grinder",
    text: "The motor spins the lower ceramic burr under the fixed upper burr. Beans fall from the hopper, are cut between the burrs, and the grounds slide down the chute into the open brew chamber.",
  },
  compress: {
    title: "Tamp",
    part: "brew",
    text: "The brew group drives its upper piston down on its hollow rod into the chamber and presses the grounds into a firm, level bed, the same job a barista's tamper does.",
  },
  preinfuse: {
    title: "Pre-infuse",
    part: "pump",
    text: "The pump pushes a short burst of hot water onto the bed, then pauses. The grounds swell and degas, so water flows through evenly instead of finding a channel.",
  },
  extract: {

    text: "The vibration pump (rated 15 bar) draws water from the tank through the flowmeter, which counts every millilitre, and pushes it through the thermoblock, down through the upper piston and the coffee bed. Resistance builds about 9 bar at the bed; coffee leaves through the crema valve in the lower piston and runs to the spout.",
  },
  water: {
    title: "Hot water",
    part: "valves",
    text: "A solenoid valve switches the heated water away from the brew group to the hot-water line, which runs to the centre nozzle of the spout.",
  },
  steam: {
    title: "Steam",
    part: "thermo",
    text: "The thermoblock runs hotter to flash a small flow of water into steam, and the steam valve sends it to the LatteGo port at the back of the cup bay.",
  },
  milk: {
    title: "Froth milk",
    part: "lattego",
    text: "In the LatteGo's frothing chamber the jet of steam pulls milk up from the container, mixes in air and spins it into foam, which pours straight into the cup. There are no tubes to clean.",
  },

function planOf({ drink, strength = 3, grind = 6, temp = 2 }) {
  const d = DRINKS.find((x) => x.id === drink) ?? DRINKS[0];
  const brewC = TEMPS.find((x) => x.id === temp)?.c ?? 93;
  const steps = [];
  const add = (id, dur, extra = {}) => steps.push({ id, dur, ...extra });
  add("heat", 3.5);
  if (d.milk) {
    add("steam", 3);
    add("milk", d.milk / 7);
  }
  const dose = doseOf(strength);
  if (d.coffee) {
    add("grind", dose / 0.9);
    add("compress", 2.8);
    add("preinfuse", 3.6);
    add("extract", d.coffee / (d.flow * grindFactor(grind)), { ml: d.coffee });
  }
  if (d.water) add("water", d.water / 8, { ml: d.water });
  if (d.coffee) add("eject", 4.2);
  let t = 0;
  for (const s of steps) {
    s.t0 = t;
    t += s.dur;
    s.t1 = t;
  }
  return { drink: d, strength, grind, temp, brewC, dose, steps, total: t };
}

const clamp01 = (v) => Math.max(0, Math.min(1, v));
const ease = (v) => {
  const x = clamp01(v);
  return x * x * (3 - 2 * x);
};

// Everything the picture and the readout need at time t (seconds of real brew).
function stateAt(plan, t) {
  const { steps, drink, dose, brewC } = plan;
  const step = steps.find((s) => t >= s.t0 && t < s.t1) ?? null;
  const done = t >= plan.total;
  const local = step ? (t - step.t0) / step.dur : 0;
  const passed = (id) => {
    const s = steps.find((x) => x.id === id);
    return !s ? 0 : clamp01((t - s.t0) / s.dur);
  };

  const ground = dose * passed("grind");
  const coffeeMl = (drink.coffee ?? 0) * passed("extract");
  const waterMl = (drink.water ?? 0) * passed("water");
  const milkMl = (drink.milk ?? 0) * passed("milk");

  // Upper piston travel: 0 at rest, 1 fully down on the bed.
  let piston = 0;
  const pc = passed("compress");
  const pe = passed("eject");
  if (drink.coffee) piston = pe > 0 ? 1 - ease(pe / 0.3) : ease(pc);

  // Puck: rises to the rim, slides off, falls into the container.
  const puck = { rise: 0, slide: 0, fall: 0 };
  if (pe > 0) {
    puck.rise = ease((pe - 0.25) / 0.25);
    puck.slide = ease((pe - 0.5) / 0.2);
    puck.fall = ease((pe - 0.7) / 0.25);
  }

  // Pressure at the bed, in bar.
  let bar = 0;
  if (step?.id === "preinfuse") bar = local < 0.45 ? 2.5 * ease(local / 0.2) : 2.5 * (1 - ease((local - 0.45) / 0.3));
  if (step?.id === "extract") bar = drink.bar * ease(local / 0.12) * (1 - 0.15 * local);
  if (step?.id === "water") bar = 1.2;
  if (step?.id === "milk" || step?.id === "steam") bar = 1.5;

  // Water temperature at the thermoblock outlet, °C.
  let tempC = 22;
  if (step) {
    const heat = steps.find((s) => s.id === "heat");
    const h = clamp01((t - heat.t0) / heat.dur);
    tempC = 22 + (brewC - 22) * ease(h * 1.05);
    if (step.id === "steam" || step.id === "milk") tempC = 120 + 10 * ease(local / 0.4);
  } else if (done) tempC = brewC - 6;

  const flowing = {
    tank: ["preinfuse", "extract", "water", "steam", "milk"].includes(step?.id) && !(step?.id === "preinfuse" && local > 0.45),
    brewIn: step?.id === "extract" || (step?.id === "preinfuse" && local <= 0.45),
    coffee: step?.id === "extract" && local > 0.1,
    water: step?.id === "water",
    steam: step?.id === "steam" || step?.id === "milk",
    milk: step?.id === "milk",
    grounds: step?.id === "grind",
  };

  const usedMl = (drink.coffee ?? 0) * passed("extract") + 6 * passed("preinfuse") + waterMl + 8 * passed("steam") + 12 * passed("milk");

  return {
    step,
    stage: step ? step.id : done ? "done" : "ready",
    local,
    done,
    ground,
    bed: ground * 1.45,
    coffeeMl,
    waterMl,
    milkMl,
    cupMl: coffeeMl + waterMl + milkMl,
    piston,
    puck,
    bar,
    tempC,
    flowing,
    usedMl,
    beansUsed: ground,
  };
}

const P = {"origin":[413.04690111892415,348.6376377070927],"scale":0.732713144610173,"azimuth":38,"elevation":30};
const KS = 0.9268169634049893;
const SCREEN = {"x":26,"z":342,"w":120,"h":66};
const KNOB = [62,214];
// Live layer: drives the figure from the pure model (stateAt) every frame.
// Kit functions (cylinder, solidSvg, lineSvg, ...) and the model/geometry
// constants are inlined above this script.

const root = document.querySelector(".cf-app");
const svg = root.querySelector(".iso-stage svg");
const slot = (name) => svg.querySelector(`[data-slot="${name}"]`);
const readout = root.querySelector("[data-readout]");
const $ = (sel) => root.querySelector(sel);
const $$ = (sel) => [...root.querySelectorAll(sel)];
const still = matchMedia("(prefers-reduced-motion: reduce)");
const AZ = ((P.azimuth ?? 45) * Math.PI) / 180;
const facing = (angle) => Math.cos(angle - AZ);

const S = (paths, style) => solidSvg(paths, style);
const L = (d, style) => lineSvg(d, style);
const seg3 = (a, b) => pathOf([iso(a, P), iso(b, P)]);

// ---------- settings and state ----------
const settings = { drink: "espresso", strength: 3, grind: 6, temp: 2, speed: 3 };
let plan = planOf(settings);
let t = 0;
let playing = false;
let touring = !still.matches;
let idleTimer = 0;
let pucks = 3;
let tankMl = 1450;
let beansG = 210;
let milkMl = 260;
let committed = false; // whether this run's consumption has been banked

// ---------- static helpers for slots ----------
// Bean surface: a fixed scatter of beans on the bed top.
const BEANS = (() => {
  let seed = 7;
  const rand = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
  const out = [];
  for (let i = 0; i < 150; i++) out.push([HOPPER.x + 9 + rand() * (HOPPER.w - 18), HOPPER.y + 9 + rand() * (HOPPER.d - 18)]);
  return out;
})();

function drawBeans(g) {
  const z = beanZ(g);
  const plan2 = { x: HOPPER.x + 4, y: HOPPER.y + 4, w: HOPPER.w - 8, d: HOPPER.d - 8, r: 2 };
  const bed = S(slabOf(plan2, HOPPER.z0 + 4, z - HOPPER.z0 - 4, P, 2), { tone: "lo", className: "cf-beans" });
  const dots = dotsSvg(BEANS.map(([x, y]) => iso([x, y, z], P)), { size: 1.25, tone: "mid" });
  const ridges = L(BEANS.filter((_, i) => i % 3 === 0).map(([x, y]) => seg3([x - 1.6, y - 0.6, z], [x + 1.6, y + 0.6, z])).join(""), { tone: "lo", free: true });
  slot("beans").innerHTML = bed + `<g class="cf-bean-dots">${dots}</g>` + ridges;
}

function drawBurr(spin) {
  const [cx, cy] = GRINDER.c;
  const z0 = GRINDER.z0 + 5;
  const z1 = z0 + 8;
  const body = S(cylinder(cx, cy, 24, z0, 8, P, 48), { tone: "hi" });
  const teeth = [];
  for (let i = 0; i < 28; i++) {
    const a = spin + (i / 28) * Math.PI * 2;
    if (facing(a) < 0.08) continue;
    const x = cx + Math.cos(a) * 24;
    const y = cy + Math.sin(a) * 24;
    teeth.push(seg3([x, y, z0 + 1.2], [x, y, z1 - 1.2]));
  }
  slot("burr").innerHTML = body + L(teeth.join(""), { tone: "lo" });
}

function drawKnob(grind) {
  const a = -Math.PI * 0.75 + ((grind - 1) / 11) * Math.PI * 1.5;
  const [cx, cy] = KNOB;
  const tip = [cx + Math.sin(a) * 8, cy - Math.cos(a) * 8];
  slot("knob").innerHTML = L(lineOnTop([cx, cy], tip, 380, P), { tone: "hi", free: "end" }) + dotsSvg([iso([cx, cy, 380], P)], { size: 0.6, tone: "hi" });
}

function drawRotor(spin) {
  const [cx, cy] = FLOWMETER.c;
  const z = FLOWMETER.z1;
  const a = spin;
  const lines = [0, 1, 2].map((i) => {
    const b = a + (i * Math.PI * 2) / 3;
    return lineOnTop([cx, cy], [cx + Math.cos(b) * 4.6, cy + Math.sin(b) * 4.6], z, P);
  });
  slot("rotor").innerHTML = L(lines.join(""), { tone: "mid", free: "end" });
}

function drawTank(ml) {
  const z = tankZ(ml);
  const inner = { x: TANK.x + 1.5, y: TANK.y + 1.5, w: TANK.w - 3, d: TANK.d - 3, r: TANK.r - 1 };
  slot("tank").innerHTML = S(slabOf(inner, TANK.z0 + 1.5, z - TANK.z0 - 1.5, P, 5), { tone: "lo", className: "cf-water", crease: "none" });
}

// Spent pucks in the grounds container.
const PUCK_AT = [[176, 286], [210, 286], [176, 254], [210, 254], [193, 224], [176, 286], [210, 286], [193, 270], [176, 240], [210, 240], [193, 286], [193, 254]];
function drawPucks(n) {
  const out = [];
  const layer = (i) => (i < 5 ? 0 : i < 10 ? 1 : 2);
  const items = PUCK_AT.slice(0, n).map(([x, y], i) => ({ x, y, z: GROUNDS.z0 + 3 + layer(i) * 12 }));
  items.sort((a, b) => a.z - b.z || depthOf([a.x, a.y, 0], P) - depthOf([b.x, b.y, 0], P));
  for (const p of items) out.push(S(cylinder(p.x, p.y, 15, p.z, 11, P, 32), { tone: "lo", className: "cf-grounds" }));
  slot("pucks").innerHTML = out.join("");
}

function drawMilkLine(ml) {
  const z = LATTEGO.z0 + 8 + (ml / 300) * 96;
  const plan2 = { x: LATTEGO.x, y: LATTEGO.y, w: LATTEGO.w, d: LATTEGO.d, r: LATTEGO.r };
  slot("milkline").innerHTML = ml > 4 ? `<path class="cf-milk-line" d="${sideSeam(plan2, z, P, 6)}"/>` : "";
}

// Bed, lower piston and the spent puck.
function drawBrew(s) {
  const [cx, cy] = CHAMBER.c;
  const rin = CHAMBER.rin - 0.6;
  const bed = Math.max(s.bed, 0);
  let lp = LOWER_PISTON_Z;
  const rim = CHAMBER.z1;
  if (s.puck.rise > 0) lp = LOWER_PISTON_Z + (rim - bed - LOWER_PISTON_Z) * (s.puck.slide > 0 ? 1 - s.puck.fall : s.puck.rise);
  let out = S(cylinder(cx, cy, rin, CHAMBER.z0 + 1, lp - CHAMBER.z0 - 1, P, 40), { tone: "mid" });
  out += L(ring(cx, cy, rin - 4, lp, P, 32), { tone: "lo" });
  out += dotsSvg([0, 1, 2, 3, 4, 5].map((i) => iso([cx + Math.cos(i) * 9, cy + Math.sin(i) * 9, lp], P)), { size: 0.5, tone: "lo" });
  if (bed > 0.2 && s.puck.slide === 0 && s.stage !== "done" && s.stage !== "ready") {
    out += S(cylinder(cx, cy, rin, lp, bed, P, 40), { tone: "lo", className: "cf-grounds" });
  }
  slot("bed").innerHTML = out;

  // Puck: slides off the rim through the frame window and drops into the container.
  if (s.puck.slide > 0 && s.puck.fall < 1) {
    const y = cy + (218 - cy) * s.puck.slide;
    const z = rim - bed + (GROUNDS.z1 - (rim - bed)) * s.puck.fall * s.puck.fall;
    const fade = 1 - Math.max(0, (s.puck.fall - 0.85) / 0.15);
    slot("puck").innerHTML = `<g opacity="${fade.toFixed(2)}">${S(cylinder(cx, y, rin, z, bed, P, 40), { tone: "lo", className: "cf-grounds" })}</g>`;
  } else slot("puck").innerHTML = "";

  // Upper piston: hollow rod out of the gland, head on its end.
  const restBottom = HEAD.rest;
  const pressBottom = LOWER_PISTON_Z + bed;
  const bottom = restBottom - (restBottom - pressBottom) * s.piston;
  const head = S(cylinder(cx, cy, HEAD.r, bottom, HEAD.h, P, 48, 0.4), { tone: "hi", inner: L(sideArc(cx, cy, HEAD.r, bottom + 4, P, 40), { tone: "lo" }) });
  const rod = S(cylinder(cx, cy, 4, bottom + HEAD.h, GLAND_Z - bottom - HEAD.h, P, 20), { tone: "mid" });
  slot("piston").innerHTML = rod + head;
}

// Dispenser and cup.
let cupKind = "small";
function spoutTip() {
  const cup = CUPS[cupKind];
  return Math.min(SPOUT_RANGE[1], Math.max(SPOUT_RANGE[0], 48 + cup.h + 8));
}
let tipZ = spoutTip();
function drawDispenser() {
  const z = tipZ;
  let out = S(slabOf({ x: 102, y: 360, w: 48, d: 44, r: 6 }, z + 6, 14, P, 4, 0.6), { tone: "mid", inner: L(sideSeam({ x: 102, y: 360, w: 48, d: 44, r: 6 }, z + 12, P, 4), { tone: "faint" }) });
  for (const [x, y, rr] of [[126, 371, 2.6], [120, 389, 3.2], [132, 389, 3.2]]) out += S(cylinder(x, y, rr, z, 6, P, 16), { tone: "hi" });
  slot("dispenser").innerHTML = out;
}

function drawCup(s) {
  const cup = CUPS[cupKind];
  const [cx, cy] = CUP_AT;
  const z0 = 48;
  const rin = cup.r - 2.4;
  const base = 4;
  let out = `<path class="iso-halo" d="${slabOf({ x: cx - cup.r, y: cy - cup.r, w: cup.r * 2, d: cup.r * 2, r: cup.r }, z0, 0.1, P, 10).fill}" style="filter:blur(3px)"/>`;
  out += S(cylinder(cx, cy, cup.r, z0, cup.h, P, 56, 0.4), { tone: "mid", className: "cf-cup" });
  // Liquid seen through the glass: coffee settles under milk foam.
  const area = Math.PI * rin * rin; // mm²
  const toH = (ml) => (ml * 1000) / area;
  const coffeeH = Math.min(cup.h - base - 1, toH(s.coffeeMl + s.waterMl));
  const milkH = Math.min(cup.h - base - 1 - coffeeH, toH(s.milkMl * 0.55));
  const foamH = Math.min(cup.h - base - 1 - coffeeH - milkH, toH(s.milkMl * 0.45) * 1.6);
  let z = z0 + base;
  const layer = (h, cls) => {
    if (h < 0.3) return "";
    const svgL = S(cylinder(cx, cy, rin, z, h, P, 48), { tone: "lo", className: cls });
    z += h;
    return svgL;
  };
  if (s.drink.id === "latte") {
    out += layer(milkH, "cf-milk") + layer(coffeeH, "cf-coffee") + layer(foamH, "cf-foam");
  } else out += layer(coffeeH, s.drink.coffee ? "cf-coffee" : "cf-water") + layer(milkH, "cf-milk") + layer(foamH, "cf-foam");
  if (coffeeH > 2 && s.drink.coffee && !s.drink.milk) out += `<path class="cf-crema" d="${ring(cx, cy, rin - 1.2, z, P, 40)}"/>`;
  // Rim and handle.
  out += L(ring(cx, cy, cup.r - 1.2, z0 + cup.h, P, 48), { tone: "lo" });
  if (cupKind !== "glass") {
    const hx = cx + cup.r * Math.cos(AZ - 0.4);
    const hy = cy + cup.r * Math.sin(AZ - 0.4);
    const hz = z0 + cup.h * 0.55;
    out += L(pathOf([[0, -1], [0.5, -0.9], [0.9, -0.4], [0.95, 0.2], [0.6, 0.75], [0, 0.9]].map(([u, v]) => iso([hx + Math.cos(AZ - 0.4) * u * 12, hy + Math.sin(AZ - 0.4) * u * 12, hz - v * cup.h * 0.24], P))), { tone: "hi", free: true });
  }
  slot("cup").innerHTML = out;
  return z;
}

// Streams: coffee, hot water, milk and grounds in the air.
function drawStreams(s, surface) {
  let out = "";
  const z = tipZ;
  if (s.flowing.coffee) out += `<path class="cf-stream cf-stream-coffee" d="${seg3([120, 389, z], [120, 389, surface]) + seg3([132, 389, z], [132, 389, surface])}"/>`;
  if (s.flowing.water) out += `<path class="cf-stream cf-stream-water" d="${seg3([126, 371, z], [126, 371, surface])}"/>`;
  if (s.flowing.milk) {
    const sx = LATTEGO.x + LATTEGO.w + 1 + 11.6;
    out += `<path class="cf-stream cf-stream-milk" d="${pathOf([iso([sx, 372, 189], P), iso([sx + 4, 372, 182], P), iso([sx + 6, 372, surface], P)])}"/>`;
  }
  if (s.flowing.grounds) out += `<path class="cf-stream cf-stream-grounds" d="${pathOf([iso([165, 124, 212], P), iso([172, 126, 196], P), iso([180, 128, LOWER_PISTON_Z + s.bed + 1], P)])}"/>`;
  slot("streams").innerHTML = out;
}

// ---------- lights, flows, screen ----------
const comps = {};
for (const g of svg.querySelectorAll("[data-comp]")) (comps[g.dataset.comp] ??= []).push(g);
let litComp = null;
function light(comp) {
  if (comp === litComp) return;
  for (const g of comps[litComp] ?? []) for (const s of g.querySelectorAll(".iso-solid")) s.removeAttribute("data-lit");
  litComp = comp;
  for (const g of comps[comp] ?? []) for (const s of g.querySelectorAll(".iso-solid")) s.setAttribute("data-lit", "");
}
// Lit parts are re-rendered each frame for moving slots; mark them again after drawing.
function relight() {
  if (!litComp) return;
  for (const g of comps[litComp] ?? []) for (const s of g.querySelectorAll(".iso-solid:not([data-lit])")) s.setAttribute("data-lit", "");
}

const flows = {};
for (const p of svg.querySelectorAll("[data-flow]")) (flows[p.dataset.flow] ??= []).push(p);
let flowState = {};
function setFlows(f) {
  for (const key of Object.keys(flows)) {
    const on = !!f[key];
    if (flowState[key] === on) continue;
    flowState[key] = on;
    for (const p of flows[key]) p.toggleAttribute("data-on", on);
  }
}

const scr = (name) => svg.querySelector(`[data-screen="${name}"]`);
function drawScreen(s) {
  scr("title").textContent = plan.drink.name;
  const beans = [];
  if (plan.drink.coffee) for (let i = 0; i < 5; i++) beans.push(`<ellipse class="cf-scr-bean${i < plan.strength ? " on" : ""}" cx="${10 + i * 9}" cy="27" rx="3" ry="4.2" transform="rotate(25 ${10 + i * 9} 27)"/>`);
  scr("beans").innerHTML = beans.join("");
  scr("stage").textContent = s.stage === "ready" ? "Ready" : s.stage === "done" ? "Enjoy" : STAGES[s.stage].title + "…";
  scr("bar").setAttribute("width", ((SCREEN.w - 16) * Math.min(1, t / plan.total)).toFixed(1));
}

// ---------- panel ----------
function renderStages() {
  const list = $("[data-stages]");
  list.innerHTML = plan.steps
    .map((st, i) => `<li data-step="${st.id}"><button type="button" data-jump="${i}"><span class="cf-step-n">${i + 1}</span><span class="cf-step-t">${STAGES[st.id].title}</span><span class="cf-step-d">${st.dur.toFixed(1)} s</span></button></li>`)
    .join("");
}
function renderFacts() {
  $("[data-fact=dose]").textContent = plan.drink.coffee ? `${plan.dose.toFixed(1)} g` : "none";
  $("[data-fact=volume]").textContent = `${(plan.drink.coffee ?? 0) + (plan.drink.water ?? 0) + (plan.drink.milk ?? 0)} ml`;
  $("[data-fact=temp]").textContent = plan.drink.coffee || plan.drink.water ? `${plan.brewC} °C` : "steam";
  $("[data-fact=time]").textContent = `${plan.total.toFixed(0)} s`;
}
let lastStage = "";
function updatePanel(s) {
  const id = s.stage;
  if (id !== lastStage) {
    lastStage = id;
    for (const li of $$("[data-stages] li")) li.toggleAttribute("data-now", li.dataset.step === id);
    const info = STAGES[id === "done" ? "ready" : id];
    $("[data-explain-title]").textContent = id === "done" ? "Done" : info.title;
    $("[data-explain]").textContent = id === "done" ? `Your ${plan.drink.name.toLowerCase()} is ready. The brew group is back at rest, ${pucks} puck${pucks === 1 ? "" : "s"} in the grounds container.` : info.text;
  }
  for (const li of $$("[data-stages] li")) {
    const st = plan.steps.find((x) => x.id === li.dataset.step);
    const share = Math.max(0, Math.min(1, (t - st.t0) / st.dur));
    li.style.setProperty("--p", share.toFixed(3));
  }
  $("[data-gauge=tank]").textContent = `${Math.round(tankMl - (committed ? 0 : s.usedMl))} ml`;
  $("[data-gauge=beans]").textContent = `${Math.round(beansG - (committed ? 0 : s.beansUsed))} g`;
  $("[data-gauge=pucks]").textContent = `${pucks + (!committed && s.puck.fall >= 1 ? 1 : 0)} / 12`;
  $("[data-gauge=cup]").textContent = `${Math.round(s.cupMl)} ml`;
  const btn = $("[data-brew]");
  btn.textContent = playing ? "Pause" : t > 0 && t < plan.total ? "Resume" : "Brew";
}

// ---------- frame ----------
let spin = 0;
let rotor = 0;
let flowPhase = 0;
function draw() {
  const s = stateAt(plan, t);
  s.drink = plan.drink;
  const part = s.step ? STAGES[s.step.id].part : null;
  light(part);
  drawBrew(s);
  drawBurr(spin);
  drawRotor(rotor);
  drawBeans(beansG - (committed ? 0 : s.beansUsed));
  drawTank(tankMl - (committed ? 0 : s.usedMl));
  drawPucks(Math.min(12, pucks + (!committed && s.puck.fall >= 1 ? 1 : 0)));
  drawMilkLine(milkMl - (committed ? 0 : s.milkMl));
  drawDispenser();
  const surface = drawCup(s);
  drawStreams(s, surface);
  relight();
  setFlows(s.flowing);
  svg.style.setProperty("--flow", `${flowPhase.toFixed(1)}px`);
  drawScreen(s);
  const label = s.stage === "ready" ? "Ready" : s.stage === "done" ? "Done" : STAGES[s.stage].title;
  const text = `${label} · ${Math.round(s.tempC)} °C · ${s.bar.toFixed(1)} bar · ${Math.round(s.cupMl)} ml`;
  if (readout.textContent !== text) readout.textContent = text;
  updatePanel(s);
  return s;
}

// ---------- loop ----------
let frame = 0;
let last = 0;
let visible = true;
let restTimer = 0;
function tick(now) {
  const dt = last ? Math.min((now - last) / 1000, 1 / 20) : 1 / 60;
  last = now;
  const s0 = stateAt(plan, t);
  if (playing) {
    t += dt * settings.speed;
    if (s0.flowing.grounds) spin += dt * 9;
    if (["preinfuse", "extract", "water", "steam", "milk"].includes(s0.stage)) rotor += dt * 14;
    flowPhase -= dt * 26;
    if (t >= plan.total) {
      t = plan.total;
      playing = false;
      bank();
      if (touring) restTimer = setTimeout(() => touring && startTour(), 4200);
    }
  }
  draw();
  frame = playing && visible ? requestAnimationFrame(tick) : 0;
}
function run() {
  if (!frame && visible) {
    last = 0;
    frame = requestAnimationFrame(tick);
  }
}
function bank() {
  if (committed) return;
  const s = stateAt(plan, plan.total);
  tankMl = Math.max(200, tankMl - s.usedMl);
  beansG = Math.max(20, beansG - s.beansUsed);
  milkMl = Math.max(0, milkMl - s.milkMl);
  if (plan.drink.coffee) pucks = (pucks % 12) + 1;
  committed = true;
}
function refill() {
  if (tankMl < 400) tankMl = 1450;
  if (beansG < 40) beansG = 210;
  if (milkMl < 40) milkMl = 260;
}

function choose(next) {
  Object.assign(settings, next);
  if (t > 0 && !committed && t >= plan.total) bank();
  plan = planOf(settings);
  cupKind = plan.drink.cup;
  tipZ = spoutTip();
  t = 0;
  committed = false;
  playing = false;
  renderStages();
  renderFacts();
  syncControls();
  draw();
}
function brew() {
  if (t >= plan.total) {
    refill();
    t = 0;
    committed = false;
  }
  playing = !playing;
  if (playing) run();
  else draw();
}

function syncControls() {
  for (const b of $$("[data-drink]")) b.setAttribute("aria-pressed", String(b.dataset.drink === settings.drink));
  for (const b of $$("[data-strength]")) b.setAttribute("aria-pressed", String(Number(b.dataset.strength) <= settings.strength));
  for (const b of $$("[data-temp]")) b.setAttribute("aria-pressed", String(Number(b.dataset.temp) === settings.temp));
  for (const b of $$("[data-speed]")) b.setAttribute("aria-pressed", String(Number(b.dataset.speed) === settings.speed));
  $("[data-strength-row]").toggleAttribute("data-off", !plan.drink.coffee);
  $("#cf-grind").value = String(settings.grind);
  $("[data-grind-out]").textContent = `${settings.grind} of 12 · ${settings.grind <= 4 ? "fine" : settings.grind >= 9 ? "coarse" : "medium"}`;
  drawKnob(settings.grind);
}

// The user takes over from the tour on any control.
function takeOver() {
  touring = false;
  clearTimeout(restTimer);
  clearTimeout(idleTimer);
}
root.addEventListener("click", (e) => {
  const b = e.target.closest("button");
  if (!b) return;
  takeOver();
  if (b.dataset.drink) choose({ drink: b.dataset.drink });
  else if (b.dataset.strength) choose({ strength: Number(b.dataset.strength) });
  else if (b.dataset.temp) choose({ temp: Number(b.dataset.temp) });
  else if (b.dataset.speed) {
    settings.speed = Number(b.dataset.speed);
    syncControls();
  } else if (b.dataset.brew !== undefined) brew();
  else if (b.dataset.jump !== undefined) {
    const st = plan.steps[Number(b.dataset.jump)];
    if (t >= plan.total) committed = false;
    t = st.t0 + st.dur * 0.35;
    draw();
  }
});
$("#cf-grind").addEventListener("input", (e) => {
  takeOver();
  choose({ grind: Number(e.target.value) });
});
document.addEventListener("keydown", (e) => {
  if (e.key === " " && (e.target === document.body || e.target.closest?.(".iso-stage"))) {
    e.preventDefault();
    takeOver();
    brew();
  }
});

new IntersectionObserver((entries) => {
  visible = entries[entries.length - 1].isIntersecting;
  if (visible && playing) run();
}, { rootMargin: "120px 0px" }).observe(svg);

// ---------- tour ----------
const TOUR = ["espresso", "cappuccino", "americano", "latte", "coffee"];
let tourIndex = 0;
function startTour() {
  if (!touring) return;
  refill();
  choose({ drink: TOUR[tourIndex++ % TOUR.length] });
  touring = true;
  playing = true;
  run();
}

// First frame: an espresso mid-extraction, so the still picture already shows the machine working.
choose({ drink: "espresso" });
{
  const ex = plan.steps.find((s) => s.id === "extract");
  t = ex.t0 + ex.dur * 0.55;
  draw();
}
if (touring) {
  tourIndex = 1;
  idleTimer = setTimeout(() => {
    if (!touring) return;
    playing = true;
    run();
  }, 1600);
}
</script></body></html>
